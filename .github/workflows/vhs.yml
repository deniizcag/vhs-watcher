name: VHS Sprachtest Watcher

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
    inputs:
      test_telegram:
        description: "Telegram test mesajı gönder"
        type: boolean
        default: false

concurrency:
  group: vhs-watcher
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install playwright requests
          playwright install --with-deps chromium

      - name: Telegram test
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.test_telegram }}
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python -c "import vhs_watcher; vhs_watcher.notify('GitHub Actions test mesajı ✅')"

      - name: Restore state
        uses: actions/cache/restore@v4
        with:
          path: vhs_state.json
          key: vhs-state-${{ github.run_id }}
          restore-keys: vhs-state-

      - name: Run watcher
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python vhs_watcher.py

      - name: Save state
        if: always()
        uses: actions/cache/save@v4
        with:
          path: vhs_state.json
          key: vhs-state-${{ github.run_id }}
